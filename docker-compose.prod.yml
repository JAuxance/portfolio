name: portfolio-prod

# Production-mode stack: Postgres + migrate/seed + the standalone Next.js image.
#
# The image build prerenders DB-backed pages, so the database must be up & seeded
# BEFORE `app` is built. Run it the easy way:
#
#     ./docker/prod.sh
#
# (which brings up db → migrates+seeds → builds → starts app, in order)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: portfolio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: applies migrations + seeds. Reuses the `deps` stage (it already has
  # the Prisma CLI, the generated client, tsx and the seed script).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/portfolio
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "node_modules/.bin/prisma migrate deploy &&
             node_modules/.bin/tsx prisma/seed.ts"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      # Build on the host network so prerendering can query PostgreSQL through
      # its loopback-only published port (never exposed to the Internet).
      network: host
      args:
        DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@127.0.0.1:5432/portfolio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/portfolio
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Admin media uploads must outlive container rebuilds — the DB keeps
      # /uploads/… paths in Project.heroImage.
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads:
