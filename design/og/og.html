<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:JB;src:url(jbmono.woff2) format('woff2');font-weight:100 800}
html,body{margin:0;background:#0A0A0B}
canvas{display:block}
</style></head><body><canvas id="c" width="1200" height="630"></canvas>
<script>
// Sober link-preview card: name, one line, one small planet.
document.fonts.load('600 60px JB').then(()=>{
const W=1200,H=630,c=document.getElementById('c'),g=c.getContext('2d');
g.fillStyle='#0A0A0B';g.fillRect(0,0,W,H);

// one very soft light behind the planet
const cx=990,cy=315,pr=100;
const glow=g.createRadialGradient(cx,cy,0,cx,cy,380);
glow.addColorStop(0,'rgba(127,176,255,0.10)');glow.addColorStop(1,'rgba(127,176,255,0)');
g.fillStyle=glow;g.fillRect(0,0,W,H);

// tilted ring helper: back half, then front half
const tilt=-0.38;
function ring(rad,front,alpha){
  g.strokeStyle='#8fb4ff';g.lineWidth=1.3;g.globalAlpha=alpha;g.beginPath();let pen=false;
  for(let i=0;i<=240;i++){
    const t=i/240*Math.PI*2, x=Math.cos(t)*rad, z=Math.sin(t)*rad;
    const y=-z*Math.sin(tilt), zz=z*Math.cos(tilt);
    const isFront=zz>0, behind=Math.hypot(x,y)<pr;
    const show=front?isFront:(!isFront&&!behind);
    if(show){const X=cx+x,Y=cy+y;pen?g.lineTo(X,Y):(g.moveTo(X,Y),pen=true)}else pen=false;
  }
  g.stroke();g.globalAlpha=1;
}
ring(pr*1.9,false,0.35);

// dark core + dotted surface (light from upper left)
g.fillStyle='#0A0A0B';g.beginPath();g.arc(cx,cy,pr*0.985,0,7);g.fill();
const N=900,gold=Math.PI*(3-Math.sqrt(5)),rot=0.5;
for(let i=0;i<N;i++){
  const y=1-i/(N-1)*2,r=Math.sqrt(1-y*y),a=i*gold+rot;
  const x=Math.cos(a)*r,z=Math.sin(a)*r; if(z<0)continue;
  const light=Math.max(0,(-x*0.5-y*0.6+z*0.7));
  g.globalAlpha=0.10+light*0.75;g.fillStyle='#dfe9ff';
  g.beginPath();g.arc(cx+x*pr,cy+y*pr,0.8+light*1.1,0,7);g.fill();
}
g.globalAlpha=1;
ring(pr*1.9,true,0.8);

// text
g.textBaseline='alphabetic';
g.fillStyle='#E8E8EA';g.font='600 76px JB';
g.fillText('Auxance Jourdan',72,325);
g.fillStyle='#8A8A92';g.font='400 26px JB';
g.fillText('Full-stack → ML research.',74,378);

// a single quiet label
g.font='500 16px JB';g.fillStyle='#5A5A62';
let x=72;for(const ch of 'PORTFOLIO'){g.fillText(ch,x,84);x+=g.measureText(ch).width+4.5}

window.__done=true;
});
</script></body></html>
