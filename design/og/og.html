<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:IT;src:url(intertight.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:JB;src:url(jbmono.woff2) format('woff2');font-weight:100 800}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head><body><canvas id="c" width="1200" height="630"></canvas>
<script>
// Link-preview card, Grok/X-inspired: pure black, stark type, one luminous horizon.
Promise.all([document.fonts.load('700 60px IT'),document.fonts.load('400 20px JB')]).then(()=>{
const W=1200,H=630,c=document.getElementById('c'),g=c.getContext('2d');
g.fillStyle='#000';g.fillRect(0,0,W,H);

// the horizon: the upper limb of a huge planet rising from the bottom edge
const cx=820,cy=1250,r=820,reach=170;
const limb=g.createRadialGradient(cx,cy,0,cx,cy,r+reach);
const p=(v)=>v/(r+reach);
limb.addColorStop(0,'#000');
limb.addColorStop(p(r-9),'#000');
limb.addColorStop(p(r-1),'rgba(255,255,255,0.05)');
limb.addColorStop(p(r),'rgba(255,255,255,0.95)');
limb.addColorStop(p(r+3),'rgba(190,210,255,0.55)');
limb.addColorStop(p(r+40),'rgba(120,150,255,0.16)');
limb.addColorStop(1,'rgba(0,0,0,0)');
g.fillStyle=limb;g.fillRect(0,0,W,H);

// a few stars, very quiet
let s=7;const R=()=>{s|=0;s=s+0x6d2b79f5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
for(let i=0;i<70;i++){const x=R()*W,y=R()*H*0.78;g.globalAlpha=0.12+R()*0.4;g.fillStyle='#fff';g.beginPath();g.arc(x,y,R()<0.1?1.3:0.7,0,7);g.fill()}
g.globalAlpha=1;

// type
g.textBaseline='alphabetic';
g.fillStyle='#fff';g.font='700 104px IT';
try{g.letterSpacing='-3px'}catch(e){}
g.fillText('Auxance Jourdan',68,262);
try{g.letterSpacing='-1px'}catch(e){}
g.font='500 44px IT';g.fillStyle='#71717a';
g.fillText('Full-stack. ML.',72,332);

// handle, bottom-left
try{g.letterSpacing='0px'}catch(e){}
g.font='400 20px JB';g.fillStyle='#52525b';
g.fillText('@auxance_j',72,566);

window.__done=true;
});
</script></body></html>
