<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:JB;src:url(jbmono.woff2) format('woff2');font-weight:100 800}
html,body{margin:0;background:#0A0A0B}
canvas{display:block}
</style></head><body><canvas id="c" width="1200" height="630"></canvas>
<script>
document.fonts.load('600 60px JB').then(()=>{
const W=1200,H=630,c=document.getElementById('c'),g=c.getContext('2d');
function rng(seed){return()=>{seed|=0;seed=seed+0x6d2b79f5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(11);
// background
g.fillStyle='#0A0A0B';g.fillRect(0,0,W,H);
function glow(x,y,r,col,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col.replace('A',a));gr.addColorStop(1,col.replace('A',0));g.fillStyle=gr;g.fillRect(0,0,W,H)}
glow(900,300,520,'rgba(127,176,255,A)',0.16);
glow(120,560,420,'rgba(179,147,255,A)',0.10);
glow(1100,560,300,'rgba(255,184,119,A)',0.07);
// stars
for(let i=0;i<260;i++){const x=R()*W,y=R()*H,s=R()<0.08?1.8:R()<0.3?1.1:0.7;g.globalAlpha=0.15+R()*0.5;g.fillStyle=R()<0.15?'#9fc2ff':'#e8e8ea';g.beginPath();g.arc(x,y,s,0,7);g.fill()}
g.globalAlpha=1;
// planet
const cx=900,cy=315,pr=210,tilt=-0.42,rot=0.5;
function proj(x,y,z){ // rotate around Y then tilt around X
 const cr=Math.cos(rot),sr=Math.sin(rot);let x1=x*cr+z*sr,z1=-x*sr+z*cr;
 const ct=Math.cos(tilt),st=Math.sin(tilt);let y1=y*ct-z1*st,z2=y*st+z1*ct;return [x1,y1,z2]}
// ring (tilted disc): points on circle in XZ plane
function ringPts(rad,n){const a=[];for(let i=0;i<n;i++){const t=i/n*Math.PI*2;a.push(proj(Math.cos(t)*rad,0,Math.sin(t)*rad*1))}return a}
function drawRing(rad,front,alpha,w){
 const pts=ringPts(rad,360);g.lineWidth=w;
 const gr=g.createLinearGradient(cx-rad,cy,cx+rad,cy);gr.addColorStop(0,'#7fb0ff');gr.addColorStop(1,'#b393ff');g.strokeStyle=gr;
 g.globalAlpha=alpha;g.beginPath();let pen=false;
 for(let i=0;i<=pts.length;i++){const p=pts[i%pts.length];const isFront=p[2]>0;
  const behindDisc=Math.hypot(p[0],p[1])<pr;
  const show=front?isFront:(!isFront&&!behindDisc);
  if(show){const X=cx+p[0],Y=cy+p[1];if(!pen){g.moveTo(X,Y);pen=true}else g.lineTo(X,Y)}else pen=false}
 g.stroke();g.globalAlpha=1}
// halo
glow(cx,cy,pr*2.0,'rgba(140,170,255,A)',0.20);
drawRing(pr*1.75,false,0.55,1.4);drawRing(pr*2.1,false,0.28,1);
// core
g.fillStyle='#0A0A0B';g.beginPath();g.arc(cx,cy,pr*0.985,0,7);g.fill();
// dotted sphere
const N=2600,gold=Math.PI*(3-Math.sqrt(5));
g.globalCompositeOperation='lighter';
for(let i=0;i<N;i++){const y=1-i/(N-1)*2,r=Math.sqrt(1-y*y),a=i*gold;
 const p=proj(Math.cos(a)*r*pr,y*pr,Math.sin(a)*r*pr);if(p[2]<0)continue;
 const lit=(p[2]/pr);const X=cx+p[0],Y=cy+p[1];
 // light from upper-left
 const light=Math.max(0,((-p[0]*0.5-p[1]*0.6+p[2]*0.8)/pr));
 g.globalAlpha=0.12+light*0.85;g.fillStyle=light>0.7?'#dfe9ff':'#7fb0ff';
 g.beginPath();g.arc(X,Y,0.9+light*1.5,0,7);g.fill()}
g.globalCompositeOperation='source-over';g.globalAlpha=1;
// rim
const rg=g.createRadialGradient(cx,cy,pr*0.96,cx,cy,pr*1.02);rg.addColorStop(0,'rgba(179,147,255,0)');rg.addColorStop(0.7,'rgba(179,147,255,0.35)');rg.addColorStop(1,'rgba(179,147,255,0)');g.fillStyle=rg;g.beginPath();g.arc(cx,cy,pr*1.03,0,7);g.fill();
drawRing(pr*1.75,true,0.95,1.6);drawRing(pr*2.1,true,0.5,1.1);
// moon on orbit
{const t=-0.6,p=proj(Math.cos(t)*pr*2.6,0,Math.sin(t)*pr*2.6);const mx=cx+p[0],my=cy+p[1];
 g.globalAlpha=0.25;g.strokeStyle='#ffb877';g.lineWidth=1;g.beginPath();
 const o=ringPts(pr*2.6,240);o.forEach((q,i)=>{const X=cx+q[0],Y=cy+q[1];i?g.lineTo(X,Y):g.moveTo(X,Y)});g.closePath();g.stroke();g.globalAlpha=1;
 glow(mx,my,40,'rgba(255,184,119,A)',0.5);g.fillStyle='#ffe2c2';g.beginPath();g.arc(mx,my,5,0,7);g.fill()}
// comet
{const x0=560,y0=70,x1=430,y1=110;const gr=g.createLinearGradient(x0,y0,x1,y1);gr.addColorStop(0,'rgba(230,240,255,0.95)');gr.addColorStop(1,'rgba(230,240,255,0)');
 g.strokeStyle=gr;g.lineWidth=1.6;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();
 glow(x0,y0,26,'rgba(200,220,255,A)',0.6);g.fillStyle='#fff';g.beginPath();g.arc(x0,y0,2.6,0,7);g.fill()}
// left vignette so text reads
const lv=g.createLinearGradient(0,0,760,0);lv.addColorStop(0,'rgba(10,10,11,0.85)');lv.addColorStop(1,'rgba(10,10,11,0)');g.fillStyle=lv;g.fillRect(0,0,760,H);
// text
g.textBaseline='alphabetic';
g.font='500 20px JB';g.fillStyle='#8A8A92';
function spaced(t,x,y,sp){for(const ch of t){g.fillText(ch,x,y);x+=g.measureText(ch).width+sp}}
spaced('AUXANCE / PORTFOLIO',72,110,4.5);
g.fillStyle='#E8E8EA';g.font='600 92px JB';
g.fillText('Auxance',66,250);g.fillText('Jourdan.',66,345);
g.font='400 27px JB';g.fillStyle='#8A8A92';
g.fillText('Full-stack student, building',72,420);
g.fillText('toward ML research.',72,460);
// footer tags
g.font='500 16px JB';
const tags=['FULL-STACK','ML','WRITING IN PUBLIC'];let tx=72;
tags.forEach(t=>{const w=g.measureText(t).width+34;g.strokeStyle='rgba(255,255,255,0.16)';g.lineWidth=1;g.beginPath();g.roundRect(tx,540,w,38,19);g.stroke();g.fillStyle='#8A8A92';g.fillText(t,tx+17,564);tx+=w+12});
window.__done=true;
});
</script></body></html>
